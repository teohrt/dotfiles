# Tell programs inside tmux that it supports 256 colors
set -g default-terminal "tmux-256color"
# Enable true color (24-bit RGB) for kitty and other terminals
set -ga terminal-overrides ",xterm-kitty:Tc,xterm-256color:Tc"
# Recognize modifier combos like Ctrl-Enter that terminals normally can't distinguish
set -s extended-keys on
# Tell tmux that kitty supports extended key sequences
set -as terminal-features 'xterm-kitty:extkeys:clipboard'
set -as terminal-features 'tmux-256color:clipboard'
# Allow OSC 52 clipboard escape sequences to pass through to kitty
set -g set-clipboard on
# Ensure tools like eza render colors and icons inside tmux
set -g default-command "COLORTERM=truecolor zsh"

# Prefix: Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support
set -g mouse on
set -s copy-command "wl-copy"

# Panes
bind -n C-Enter split-window -h -c "#{pane_current_path}"
bind -n S-C-Enter split-window -v -c "#{pane_current_path}"
bind -n C-j next-layout
bind -n C-f resize-pane -Z
bind -n C-q kill-pane
bind -n C-s display-popup -E -w 20% -h 20% "env -u _SHELL_CONFIG_LOADED zsh -ic tmux-sessions"
bind -n C-w display-popup -E -w 90% -h 90% "workmux dashboard"
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind -n S-C-Left swap-pane -U
bind -n S-C-Right swap-pane -D
bind -n S-C-Up swap-pane -U
bind -n S-C-Down swap-pane -D

# Windows (tabs)
bind -n C-n new-window -c "#{pane_current_path}"
bind -n C-t command-prompt -I "#W" "rename-window '%%'"
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Longer scrollback
set -g history-limit 50000

# Pane borders
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#81a1c1"

# Status bar
set -g status-position top
set -g status 2
set -g status-format[1] " "
set -g status-style "bg=default,fg=#81a1c1"
set -g status-justify absolute-centre
set -g status-left "#[bg=#81a1c1,fg=#000000,bold] #S #[default] "
set -g status-left-length 20
set -g status-right " #[bg=#81a1c1,fg=#000000,bold] #H #[default]"
set -g status-right-length 20
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#81a1c1,fg=#000000,bold"
